name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Scan Python for high-severity security issues
        run: bandit -r backend -lll -iii
      - name: Generate Python SBOM
        run: cyclonedx-py requirements -i requirements.txt -o sbom-python.json
      - run: npm ci
        working-directory: frontend
      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: secagentx-sbom
          path: sbom-python.json
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
