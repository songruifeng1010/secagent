[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secagentx"
version = "4.0.0"
description = "AI 多智能体协同安全检测系统"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.7.0",
    "aiofiles>=23.2.0",
    "numpy>=1.26.0",
    "prometheus-client>=0.20.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
credentials = ["keyring>=25.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "pytest-timeout>=2.3.0", "build>=1.2.0"]
ml = ["chromadb>=0.5.0", "sentence-transformers>=2.6.0", "pandas>=2.0.0", "scikit-learn>=1.3.0", "xgboost>=2.0.0", "lightgbm>=4.0.0", "imbalanced-learn>=0.12.0", "joblib>=1.3.0"]

[project.scripts]
secagentx = "backend.cli_app:main"

[project.urls]
Homepage = "https://github.com/songruifeng1010/secagent"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "tests*", "scripts*", "data*", "knowledge_data*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 60
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: 单元测试（快速，不依赖外部 API）",
    "integration: 集成测试（需要 Mock 环境）",
    "slow: 耗时测试（默认跳过）",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/__pycache__/*",
    "backend/storage/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except ImportError",
    "except Exception",
    "logger.error",
    "logger.warning",
    "logger.info",
    "logger.debug",
    "pass",
]
